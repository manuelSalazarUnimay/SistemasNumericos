<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Didáctico de Bases Numéricas</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwindConfig.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

<!-- HEADER MODULAR (SIN CAMBIOS) -->
<div id="header-root"></div>

<!-- CONTENEDOR PRINCIPAL -->
<div class="w-full flex-grow flex flex-col lg:flex-row gap-6 p-4 md:p-6">

    <!-- SIDEBAR MODULAR (SIN CAMBIOS) -->
    <div id="sidebar-root" class="shrink-0"></div>

    <!-- ÁREA DE TRABAJO DINÁMICA (CONVERSIÓN ARRIBA, DESGLOSE ABAJO) -->
    <main class="flex-grow flex flex-col gap-6 w-full min-w-0">
        <!-- Vista inicial visible -->
        <div id="form-root" class="w-full"></div>

        <!-- Vista secundaria oculta de entrada -->
        <div id="results-root" class="w-full hidden"></div>
    </main>
</div>

<!-- FOOTER -->
<footer class="bg-slate-800 text-slate-400 text-center py-4 text-xs border-t border-slate-700 mt-auto">
    Diseño UI/UX • Arquitectura de Computadores
</footer>

<script src="js/loader.js"></script>
</body>
</html>
