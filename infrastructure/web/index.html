<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Didáctico de Bases Numéricas</title>

    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Configuración Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwindConfig.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER MODULAR -->
    <div id="header-root"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="max-w-7xl mx-auto w-full flex-grow flex flex-col md:flex-row gap-6 p-6">
        <!-- SIDEBAR MODULAR -->
        <div id="sidebar-root" class="shrink-0"></div>

        <!-- ÁREA DE TRABAJO DINÁMICA -->
        <main class="flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div id="form-root" class="lg:col-span-4"></div>
            <div id="results-root" class="lg:col-span-8 flex flex-col"></div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="bg-slate-800 text-slate-400 text-center py-4 text-xs border-t border-slate-700 mt-auto">
        Diseño UI/UX • Arquitectura de Computadores
    </footer>

    <!-- CARGADOR DE MÓDULOS -->
    <script src="js/loader.js"></script>
</body>
</html>
