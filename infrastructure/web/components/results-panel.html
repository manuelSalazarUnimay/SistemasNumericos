<section class="bg-white rounded-xl shadow-md border-t-4 border-brandBlue w-full overflow-hidden">

    <!-- CABECERA CON BOTÓN VOLVER -->
    <div class="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <span class="p-2 bg-brandBlue text-white rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </span>
            <div>
                <h3 class="font-bold text-brandBlue text-base">Desglose Procedimental y Explicación Paso a Paso</h3>
                <p class="text-xs text-slate-500">Estructura matemática detallada de la conversión</p>
            </div>
        </div>

        <!-- BOTÓN REGRESAR AL CONVERSOR -->
        <button id="btnBackToForm" type="button" class="flex items-center space-x-2 bg-white hover:bg-slate-100 text-brandBlue font-bold py-2 px-3.5 rounded-lg border border-slate-300 shadow-sm transition text-xs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>Regresar al Conversor</span>
        </button>
    </div>

    <!-- CONTENIDO DEL DESGLOSE -->
    <div class="p-6 space-y-6">
        <div class="flex border-b border-slate-200 overflow-x-auto">
            <button id="tabCalc" class="py-2.5 px-6 font-bold text-brandBlue border-b-2 border-brandBlue whitespace-nowrap">
                Desglose Posicional
            </button>
            <button id="tabExploreFrom" class="py-2.5 px-6 font-semibold text-slate-500 hover:text-brandBlue transition whitespace-nowrap">
                Estructura Base Origen
            </button>
            <button id="tabExploreTo" class="py-2.5 px-6 font-semibold text-slate-500 hover:text-brandBlue transition whitespace-nowrap">
                Estructura Base Destino
            </button>
        </div>

        <div>
            <div id="contentCalc" class="block space-y-4">
                <div id="resultBanner" class="bg-brandBlue/5 border border-brandBlue/20 rounded-xl p-5 text-center">
                    <span id="resultFromLabel" class="text-xs font-mono font-bold text-brandBlue/80 uppercase tracking-widest block">Entrada</span>
                    <p id="resultFromValue" class="text-lg font-mono font-bold text-slate-700">---</p>
                    <div class="text-brandYellow text-xl font-black my-1">↓</div>
                    <p id="resultValue" class="text-4xl font-black text-brandBlue">---</p>
                    <span id="resultToLabel" class="text-xs font-mono font-bold text-brandBlue/80 uppercase tracking-widest block mt-1">Resultado</span>
                </div>

                <div id="stepsContainer" class="space-y-2.5">
                    <div class="text-center py-8 text-slate-400 italic">
                        Ingresa un número y presiona "Convertir" para ver la resolución detallada.
                    </div>
                </div>
            </div>

            <div id="contentExploreFrom" class="hidden">
                <div class="bg-slate-50 border border-slate-200 rounded-lg p-5">
                    <h3 class="text-sm font-bold text-brandBlue mb-4 uppercase tracking-wide" id="exploreTitleFrom">Base Origen</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm font-mono text-slate-700" id="baseExploreContentFrom"></div>
                </div>
            </div>

            <div id="contentExploreTo" class="hidden">
                <div class="bg-slate-50 border border-slate-200 rounded-lg p-5">
                    <h3 class="text-sm font-bold text-brandBlue mb-4 uppercase tracking-wide" id="exploreTitleTo">Base Destino</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm font-mono text-slate-700" id="baseExploreContentTo"></div>
                </div>
            </div>
        </div>
    </div>
</section>
