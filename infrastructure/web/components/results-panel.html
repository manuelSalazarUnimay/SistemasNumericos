<section class="lg:col-span-8 bg-white p-6 rounded-xl shadow-md border-t-4 border-brandBlue flex flex-col">

    <!-- TABS DE NAVEGACIÓN -->
    <div class="flex border-b border-slate-200 mb-6 overflow-x-auto">
        <button id="tabCalc" class="py-2 px-4 font-bold text-brandBlue border-b-2 border-brandBlue focus:outline-none flex items-center whitespace-nowrap">
            Paso a Paso
        </button>
        <button id="tabExploreFrom" class="py-2 px-4 font-semibold text-slate-500 hover:text-brandBlue focus:outline-none flex items-center transition whitespace-nowrap">
            Estructura Base Origen
        </button>
        <button id="tabExploreTo" class="py-2 px-4 font-semibold text-slate-500 hover:text-brandBlue focus:outline-none flex items-center transition whitespace-nowrap">
            Estructura Base Destino
        </button>
    </div>

    <!-- CONTENIDOS -->
    <div class="flex-grow">
        <!-- Tab 1: Paso a Paso -->
        <div id="contentCalc" class="block">
            <div id="resultBanner" class="bg-brandBlue/5 border border-brandBlue/20 rounded-lg p-4 mb-6 hidden">
                <span class="text-xs uppercase font-bold text-brandBlue tracking-wider">Resultado Obtenido</span>
                <p class="text-3xl font-mono font-bold text-brandBlue mt-1" id="resultValue">---</p>
            </div>
            <div id="stepsContainer" class="space-y-3">
                <div class="text-center py-12 text-slate-400 italic">
                    Ingresa un número y presiona "Calcular" para ver la resolución detallada.
                </div>
            </div>
        </div>

        <!-- Tab 2: Base Origen -->
        <div id="contentExploreFrom" class="hidden">
            <div class="bg-slate-50 border border-slate-200 rounded-lg p-5">
                <h3 class="text-sm font-bold text-brandBlue mb-4 uppercase tracking-wide" id="exploreTitleFrom">Base Origen</h3>
                <div class="grid grid-cols-2 gap-4 text-sm font-mono text-slate-700" id="baseExploreContentFrom"></div>
            </div>
        </div>

        <!-- Tab 3: Base Destino -->
        <div id="contentExploreTo" class="hidden">
            <div class="bg-slate-50 border border-slate-200 rounded-lg p-5">
                <h3 class="text-sm font-bold text-brandBlue mb-4 uppercase tracking-wide" id="exploreTitleTo">Base Destino</h3>
                <div class="grid grid-cols-2 gap-4 text-sm font-mono text-slate-700" id="baseExploreContentTo"></div>
            </div>
        </div>
    </div>
</section>
