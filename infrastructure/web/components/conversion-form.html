<section class="converter-container p-6 md:p-8 rounded-xl shadow-lg border-slate-200">
    <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold tracking-tight text-[var(--brand-blue)] flex items-center">
            <svg class="w-6 h-6 mr-2 text-[var(--brand-yellow)]" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"></path>
                <path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd"></path>
            </svg>
            Conversión Numérica
        </h2>
    </div>

    <!-- EJEMPLOS RÁPIDOS -->
    <div class="mb-6 p-4 bg-slate-50 border border-slate-200 rounded-xl">
        <span class="block text-xs font-bold text-[var(--brand-blue)] uppercase tracking-wider mb-2.5">Ejemplos de Referencia</span>
        <div class="flex items-center gap-3 overflow-x-auto pb-1 no-scrollbar">
            <span class="sample-chip flex items-center shadow-sm">
                <strong class="text-[var(--brand-blue)] mr-1.5">1010₂</strong> = <span class="text-emerald-600 font-bold ml-1.5">10₁₀</span>
            </span>
            <span class="sample-chip flex items-center shadow-sm">
                <strong class="text-[var(--brand-blue)] mr-1.5">11111111₂</strong> = <span class="text-emerald-600 font-bold ml-1.5">255₁₀</span>
            </span>
            <span class="sample-chip flex items-center shadow-sm">
                <strong class="text-[var(--brand-blue)] mr-1.5">1101₂</strong> = <span class="text-emerald-600 font-bold ml-1.5">13₁₀</span>
            </span>
        </div>
    </div>

    <form id="conversionForm" class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-stretch">

        <!-- ENTRADA DE DATOS -->
        <div class="xl:col-span-8 space-y-5">
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-sm font-semibold text-slate-700">Número de Origen</label>
                    <span id="baseBadge" class="text-xs font-bold uppercase bg-[var(--brand-blue)] text-white px-2.5 py-0.5 rounded-full">Base 10</span>
                </div>
                <input type="text" id="inputValue" placeholder="Ej. 1111" required autocomplete="off"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[var(--brand-blue)] focus:outline-none uppercase font-mono text-2xl font-bold tracking-widest text-slate-800">
            </div>

            <div id="bitPreview" class="flex flex-wrap justify-center gap-2 p-3 bg-slate-50 border border-slate-200 rounded-xl min-h-[60px] items-center">
                <span class="text-xs text-slate-400 italic">Escribe un número para previsualizar sus posiciones</span>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Base Origen</label>
                    <select id="baseFrom" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-[var(--brand-blue)] text-sm font-medium"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Base Destino</label>
                    <select id="baseTo" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-[var(--brand-blue)] text-sm font-medium"></select>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN MEJORADOS -->
            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button type="submit" id="btnConvert" class="btn-primary-action flex-1 py-3 px-4 rounded-lg shadow-md flex items-center justify-center space-x-2">
                    <span>Convertir</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>

                <button type="button" id="btnSwap" class="btn-secondary-action py-3 px-4 rounded-lg shadow-sm flex items-center justify-center space-x-2 text-sm" title="Invertir Bases">
                    <svg class="w-5 h-5 text-[var(--brand-blue)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                    </svg>
                    <span>Invertir</span>
                </button>

                <button type="button" id="btnReset" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-lg border border-slate-300 transition duration-200 flex items-center justify-center space-x-2 text-sm" title="Nueva Conversión">
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Nueva Conversión</span>
                </button>
            </div>
        </div>

        <!-- RESULTADO INMEDIATO -->
        <div class="xl:col-span-4 quick-result-card flex flex-col justify-between p-6 rounded-xl text-center shadow-sm">
            <div>
                <span class="text-xs font-bold text-[var(--brand-blue)] uppercase tracking-wider block mb-2">Resultado Inmediato</span>
                <div class="my-auto py-6">
                    <p id="quickResultDisplay" class="quick-result-value tracking-tight">---</p>
                    <span id="quickResultBase" class="text-xs text-slate-500 font-mono font-bold mt-2 block">Esperando conversión...</span>
                </div>
            </div>

            <button type="button" id="btnShowDetails" class="btn-secondary-action w-full py-2.5 px-3 rounded-lg shadow-sm text-xs flex items-center justify-center space-x-2">
                <span>Ver desglose completo</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </form>

    <div id="errorAlert" class="hidden mt-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 text-sm rounded"></div>
</section>
