<section class="lg:col-span-4 bg-white p-6 rounded-xl shadow-md border-t-4 border-brandYellow h-fit">
    <h2 class="text-lg font-bold text-brandBlue mb-4 flex items-center">
        <svg class="w-5 h-5 mr-2 text-brandYellow" fill="currentColor" viewBox="0 0 20 20"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"></path><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd"></path></svg>
        Conversión Numérica
    </h2>

    <form id="conversionForm" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Número de Origen</label>
            <input type="text" id="inputValue" placeholder="Ej. 10101, 2A, 255" required
                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brandBlue focus:outline-none uppercase font-mono">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Base Origen</label>
            <select id="baseFrom" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-brandBlue"></select>
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Base Destino</label>
            <select id="baseTo" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-brandBlue"></select>
        </div>

        <!-- Botones de Acción -->
        <div class="flex flex-col sm:flex-row gap-2 pt-2">
            <button type="submit" id="btnConvert"
                class="flex-1 bg-brandYellow hover:bg-brandYellow-hover text-brandBlue-dark font-bold py-3 px-3 rounded-lg shadow-md transition duration-200 flex items-center justify-center space-x-2">
                <span>Convertir</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
            <button type="button" id="btnReset"
                class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 px-4 rounded-lg border border-slate-300 transition duration-200 flex items-center justify-center space-x-1" title="Limpiar y realizar otra conversión">
                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>Nueva Conversión</span>
            </button>
        </div>
    </form>

    <div id="errorAlert" class="hidden mt-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 text-sm rounded"></div>
</section>
